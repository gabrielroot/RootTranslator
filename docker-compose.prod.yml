services:
  app:
    image: ghcr.io/gabrielroot/roottranslator:main
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - app_storage:/var/www/storage
    networks:
      - laravel_prod
      - dokploy-network 
    depends_on:
      - redis
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - laravel_prod
      - dokploy-network 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

