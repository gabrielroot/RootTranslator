services:
  app:
    image: ghcr.io/gabrielroot/roottranslator:octane
    pull_policy: always
    container_name: ${APP_NAME:-laravel}_app_prod
    restart: unless-stopped
    # ports:
    #   - "80:8000"
    volumes:
      - app_storage:/var/www/storage
    networks:
      - laravel_prod
      - coolify 
    # depends_on:
    #   redis:
    #     condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_HOST: redis
      OCTANE_SERVER: swoole
      # Configurações de performance do Octane
      OCTANE_WORKERS: 4  # Ajuste baseado no número de CPUs
      OCTANE_TASK_WORKERS: 4
      OCTANE_MAX_REQUESTS: 1000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.entrypoints=http,https"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  # Redis Cache
