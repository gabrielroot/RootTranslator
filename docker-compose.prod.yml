services:
  app:
    image: ghcr.io/gabrielroot/roottranslator:main
    pull_policy: always
    container_name: ${APP_NAME:-laravel}_app_prod
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - app_storage:/var/www/storage
    networks:
      - laravel_prod
      - coolify 
    # depends_on:
    #   redis:
    #     condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

