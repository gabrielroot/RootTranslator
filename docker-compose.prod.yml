  #       limits:
  #         cpus: '0.5'
  #         memory: 256M

  # ---------------------------------------------------------------------------
  # Scheduler (para quando usar agendamentos)
  # ---------------------------------------------------------------------------
  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: docker/php/Dockerfile.prod
