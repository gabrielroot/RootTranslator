  #   command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
  #   volumes:
  #     - app_storage:/var/www/storage
  #   networks:
  #     - laravel_prod
  #   depends_on:
  #     app:
  #       condition: service_healthy

networks:
  laravel_prod:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  app_storage:
  redis_data:
